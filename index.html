<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <!-- No icon file: an empty data URL keeps the browser from requesting /favicon.ico. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="storage.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>To do list</h1>
    <div class="wrapper">
        <form>
            <input id="write-input" type="text" placeholder="Type here..."
                   aria-label="New task" autocomplete="off">
            <button id="add-btn">ADD</button>
        </form>
        <ul id="list"></ul>
        <!-- One list item. script.js clones it and fills in id, text and state.
             Icons: Material Symbols "check" and "delete" (Google, Apache License 2.0). -->
        <template id="todo-template">
            <li class="to-do">
                <input type="checkbox">
                <label class="custom-checkbox">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
                </label>
                <label class="to-do-text"></label>
                <button type="button" class="delete-btn">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                </button>
            </li>
        </template>
    </div>

    <footer class="footer">
        <a href="https://github.com/aaronkuy">Aaron Kuyucu</a> · <a href="https://github.com/aaronkuy/to-do-list#credits">Source and credits on GitHub</a>
    </footer>
</body>
</html>
